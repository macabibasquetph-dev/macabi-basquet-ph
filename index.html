  <footer class="pie">

        <svg aria-hidden="true"><use href="#i-balon"/></svg>
        <div>
          <strong>MACABI BÁSQUET PH</strong>
          <p>“Fotografía de básquet y momentos que quedan.”</p>
        </div>
      </div>
      <nav class="pie-nav" aria-label="Pie de página">
        <a href="#/fotos">Fotos</a>
        <a href="#/partidos">Partidos</a>
        <a href="#/categorias">Categorías</a>
        <a href="#/buscar">Buscar</a>
      </nav>
      <small class="pie-copy">©️ 2026 Macabi Básquet PH</small>
    </div>
  </footer>

    <a href="#/" data-nav="inicio"><svg aria-hidden="true"><use href="#i-inicio"/></svg><span>Inicio</span></a>

  <!-- Visor de fotos a pantalla completa -->
  <div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Visor de fotos" hidden>
    <div class="visor-arriba">
      <div class="visor-titulo">
        <strong id="visor-titulo"></strong>
        <span id="visor-contador"></span>
      </div>
      <button class="visor-btn" id="visor-cerrar" aria-label="Cerrar"><svg><use href="#i-cerrar"/></svg></button>
    </div>
    <div class="visor-escena" id="visor-escena">
      <div class="visor-cargando" id="visor-cargando" aria-hidden="true"><svg><use href="#i-balon"/></svg></div>
      <img id="visor-img" alt="">
    </div>
    <button class="visor-nav visor-prev" id="visor-prev" aria-label="Foto anterior"><svg><use href="#i-izq"/></svg></button>
    <button class="visor-nav visor-sig" id="visor-sig" aria-label="Foto siguiente"><svg><use href="#i-der"/></svg></button>
    <div class="visor-abajo">
      <a class="visor-accion" id="visor-descargar" href="#" download><svg><use href="#i-descargar"/></svg>Descargar</a>
      <button class="visor-accion" id="visor-compartir" hidden><svg><use href="#i-compartir"/></svg>Compartir</button>
    </div>
  </div>
